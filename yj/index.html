<div class="head"><h2>면접 전략 — 먼저 읽고 시작하세요</h2>

<div class="card"><h3>1. 면접관이 확인하려는 4가지</h3>

   "“프로젝트를 시작할 수 있었던 구체적인 계기는 [실제로 학습한 C언어 내용·만든 코드·날짜]와 연결해서 설명하겠습니다.”",
   "“입시 준비가 계기 중 하나였는지까지 포함해 사실대로 말하고, 그보다 중요한 것은 실제로 구현하고 수정한 과정을 근거로 제시하겠습니다.”"],
  fu:["→ “2학년 때 공부한 걸 증명할 수 있나요?” → 당시 작성한 코드·학습 기록을 언급할 수 있도록 준비하세요."],
  warn:"없는 성장 서사를 만들어 내지 마세요. 1학년 때의 관심과 3학년 9~10월 실제 개발 사이의 과정을 사실에 맞게 정리하세요."},

 {lv:"b",q:"왜 Python이 아니라 C언어로 구현했나요? Python이 훨씬 쉬웠을 텐데요.",
  int:"언어 선택에 <b>이유가 있는지</b>. “어려운 걸 했으니 봐 달라”는 식이면 감점입니다.",
  ans:["“C언어에서는 <code>unsigned char</code> 배열과 포인터를 이용해 바이트를 직접 다루는 과정을 배우기 좋아 선택했습니다. Python도 바이트 처리를 할 수 있으므로, C가 유일한 방법이라는 뜻은 아닙니다.”",
   "“둘째, 배열의 메모리 크기, 자료형 선택, 범위 검사 등 시스템 프로그래밍의 기초를 연습할 수 있었습니다.”",
   "“셋째, 기존 C 기반 파일 카빙 도구의 구현을 이해하는 데도 도움이 되겠다고 판단했습니다. 해당 도구의 소스코드를 실제 읽었다고 주장하려면 근거가 필요합니다.”",
   "“특히 바이트 배열 저장형을 <code>int</code>에서 <code>unsigned char</code>로 바꿔 해당 배열의 원소당 메모리를 4바이트에서 1바이트로 줄인 경험이 의미 있었습니다. 전체 프로그램 메모리가 반드시 1/4이 된다는 뜻은 아닙니다.”"],
  fu:["→ “C의 어떤 점이 가장 힘들었나요?” → 포인터 범위를 넘는 접근, 메모리 해제 누락 등 구체적으로."]},

 {lv:"b",q:"2개월 동안 어떤 순서로 개발했는지 말해 주세요.",
  int:"<b>계획적으로 진행했는가.</b> 실제로 만든 사람만이 순서를 자연스럽게 말할 수 있습니다.",
  ans:["“크게 4단계였습니다. 1. <b>기초 탐색</b>: 시그니처와 푸터만으로 파일을 찾아 저장하는 최소 기능을 먼저 만들었습니다.”",
   "“2. <b>버그 수정</b>: 2MB 이상 저장 실패, GIF·PDF가 중간에 끊기는 문제를 발견해 자료형과 종료 조건을 고쳤습니다.”",
   "“3. <b>단편화 복구</b>: 가장 오래 걸린 단계로, PNG는 CRC32, JPEG는 마커 규칙을 이용해 끊긴 조각을 잇도록 만들었습니다.”",
   "“4. <b>결과 정리</b>: ZIP 내부 문서 종류 구분과 디스크 맵·통계 리포트를 추가했습니다.”",
   "“즉 <b>동작하는 최소 버전을 먼저 만들고, 문제를 발견할 때마다 기능을 덧붙이는</b> 방식으로 진행했습니다.”"],
  fu:["→ “어느 단계에서 가장 오래 멈춰 있었나요?”"]},

 {lv:"b",q:"개발하면서 가장 어려웠던 순간과, 그걸 어떻게 해결했는지 말해 주세요.",
  int:"<b>문제 해결 과정</b>이 핵심. 결과만 말하면 점수가 안 나옵니다.",
  ans:["“GIF와 PDF가 저장 도중 끊기는 문제였습니다. 처음에는 코드 오류인 줄 알고 한참 엉뚱한 곳을 봤습니다.”",
   "“실적설명서에는 GIF·PDF 데이터를 저장하다 종료 표식과 비슷한 값 때문에 파일이 중간에 끊기는 문제를 발견했다고 적혀 있습니다. 진짜 끝 표식인지 확인하려면 파일의 형식 구조를 따라가야 합니다.”",
   "“그래서 <b>패턴만 찾는 방식을 버리고, 포맷 구조를 따라가는 방식으로 바꿨습니다.</b> GIF는 블록마다 길이 정보가 있어서 그 길이만큼 건너뛰며 진짜 끝까지 따라가도록 수정했고, PNG는 청크 길이+12, JPEG는 마커를 따라가는 식으로 포맷별 로직을 분리했습니다.”",
   "“이때 <b>‘단순한 패턴 매칭의 한계’</b>를 몸으로 배웠습니다.”"],
  fu:["→ “문제를 어떻게 재현하고 확인했나요?” → 사용한 편집기·도구·파일은 직접 사용한 경우에만 말하세요."]},

 {lv:"b",q:"전체 코드는 몇 줄 정도이고, 혼자 작성한 비율은 어느 정도입니까?",
  int:"규모를 <b>정확히 파악</b>하고 있는지, AI 비율을 솔직히 말하는지.",
  ans:["“전체 분량과 함수 구성은 미리 정리해 두고 정확한 수치로 답하세요. (예: 약 줄, 함수 개)”",
   "“구조 설계와 시그니처·푸터 테이블, EOCD 분석, 자료형 최적화는 <b>제가 직접</b> 작성했습니다.”",
   "“JPEG 마커 유효성 검사 로직과 리포트 출력 형식 일부는 AI의 도움을 받아 초안을 만든 뒤, 동작을 이해하고 제 코드에 맞게 수정했습니다.”"],
  fu:["→ “AI가 도와준 그 함수, 지금 설명해 보세요.” — 입력과 반환값, 예외 처리를 설명해 보세요."],
  warn:"줄 수를 모르면 “직접 만들지 않았다”는 인상을 줍니다. <b>면접 전에 꼭 세어 보세요.</b>"}
 ],

 format:[
 {lv:"a",q:"시그니처와 푸터가 무엇인지, 예를 들어 설명해 주세요.",
  int:"가장 기본. 여기서 막히면 그 뒤 질문은 의미가 없습니다.",
  ans:["“파일 시그니처는 파일 형식을 판별할 때 참고하는 <b>특징적인 바이트 패턴</b>입니다. 주로 파일 앞부분에 나타나지만 모든 형식이 고정된 단일 시그니처를 갖는 것은 아닙니다.”",
   "“푸터는 일부 파일 형식에서 <b>종료를 나타내는 바이트 또는 구조</b>입니다. 모든 파일에 단순한 푸터가 있는 것은 아닙니다.”",
   "“예를 들어 JPEG는 SOI 마커 <code>FF D8</code>로 시작하고 대개 <code>FF D9</code>(EOI)로 끝납니다. PNG의 8바이트 시그니처는 <code>89 50 4E 47 0D 0A 1A 0A</code>입니다.”",
   "“확장자는 사용자가 마음대로 바꿀 수 있지만 시그니처는 파일 내용 자체에 있어서, <b>확장자를 .txt로 바꿔도 실제로는 JPEG라는 걸 알아낼 수 있습니다.</b>”"],
  fu:["→ “확장자를 바꾼 파일을 실제로 테스트해 봤나요?”"]},

 {lv:"a",q:"JPEG의 시그니처와 푸터를 말해 보세요. 그런데 FF D9가 이미지 데이터 중간에 우연히 나올 수도 있지 않나요?",
  int:"<b>매우 자주 나오는 함정 질문입니다.</b> 표면적 지식인지 포맷을 진짜 읽었는지 가릅니다.",
  ans:["“JPEG는 SOI <code>FF D8</code>로 시작하고 EOI <code>FF D9</code>로 끝나는 형식입니다.”",
   "“말씀하신 우려는 타당하지만, JPEG는 그걸 막는 장치가 있습니다. 압축된 픽셀 데이터 안에서 <code>FF</code> 바이트가 실제 값으로 필요하면 <b>뒤에 <code>00</code>을 끼워 넣어 <code>FF 00</code>으로 기록</b>합니다. 이를 바이트 스터핑이라고 하며, 덕분에 데이터 중간의 <code>FF</code>가 마커로 오인되지 않습니다.”",
   "“일부 JPEG는 APP/EXIF 영역에 JPEG 형식의 썸네일을 포함할 수 있습니다. 따라서 JPEG 파일의 구조를 고려하지 않고 가장 먼저 나오는 <code>FF D9</code>에서 자르면 잘못된 범위를 복구할 위험이 있습니다. 실제로 이 오류를 겪었다고 말하려면 테스트 근거가 필요합니다.”",
   "“그래서 제 코드에서는 <code>FF</code> 뒤에 오는 마커를 하나씩 확인하며 넘어가는 방식으로 처리했습니다.”"],
  fu:["→ “SOS 마커가 뭔가요?” → <code>FF DA</code>, Start of Scan. 압축된 픽셀 데이터가 시작되는 지점."],
  tip:"EXIF 썸네일 이야기까지 나오면 <b>“직접 디버깅해 본 사람”</b>으로 확실히 인식됩니다."},

 {lv:"b",q:"PNG 파일의 구조를 설명해 보세요.",
  int:"청크 구조를 말할 수 있어야 뒤의 단편화 복구 설명이 성립합니다.",
  ans:["“PNG는 맨 앞 <b>8바이트 시그니처</b> 뒤에, <b>청크</b>라는 단위가 계속 이어지는 구조입니다.”",
   "“청크 하나는 1. 길이 4바이트 2. 종류 4바이트 3. 데이터 4. CRC32 4바이트로 구성됩니다. 길이는 <b>데이터 부분만의</b> 크기입니다.”",
   "“주요 청크는 이미지 정보를 담은 IHDR, 실제 픽셀 데이터가 들어 있는 IDAT, 파일 끝을 알리는 IEND입니다.”",
   "“이 구조 덕분에 <b>각 청크마다 CRC로 손상 여부를 확인할 수 있고</b>, 제 단편화 복구는 바로 이 성질을 이용했습니다.”"],
  fu:["→ “청크가 여러 개로 쪼개져 있어도 되나요?” → IDAT는 여러 개로 나뉠 수 있습니다."]},

 {lv:"b",q:"PNG에서 ‘시그니처 8바이트 후 데이터 크기+12바이트씩 건너뛴다’고 썼는데, 왜 하필 12인가요?",
  int:"<b>숫자의 근거를 묻는 전형적 검증 질문.</b> 베껴 쓴 사람은 여기서 무너집니다.",
  ans:["“청크에서 데이터를 제외한 고정 부분이 <b>길이 4바이트 + 종류 4바이트 + CRC 4바이트 = 12바이트</b>이기 때문입니다.”",
   "“그래서 현재 청크의 시작 위치에서 <code>12 + 데이터 길이</code>만큼 이동하면 정확히 다음 청크의 시작에 도착합니다.”",
   "“맨 처음에 8을 건너뛰는 것은 PNG 시그니처가 8바이트이기 때문이고, 그 뒤부터는 이 12바이트 규칙이 반복됩니다.”"],
  fu:["→ “길이 값은 빅 엔디언인가요 리틀 엔디언인가요?” → <b>PNG는 빅 엔디언</b>입니다. (ZIP과 반대)"]},

 {lv:"b",q:"CRC32가 무엇인가요? 오류를 고칠 수도 있나요?",
  int:"<b>검출과 정정을 구분</b>하는지가 포인트입니다. 많은 지원자가 여기서 틀립니다.",
  ans:["“CRC32는 데이터를 기반으로 계산하는 <b>32비트 오류 검출값</b>입니다. 데이터가 바뀌면 값이 달라지는 경우가 많지만 충돌 가능성이 있어 모든 손상을 100% 찾아내는 것은 아닙니다.”",
   "“중요한 건 CRC는 <b>오류를 검출할 뿐 고치지는 못한다</b>는 점입니다. ‘뭔가 잘못됐다’는 것만 알려 줍니다. 오류를 정정하려면 해밍 코드 같은 별도의 방식이 필요합니다.”",
   "“프로젝트에서는 CRC 불일치를 단편화 탐색의 <b>출발 신호</b>로 사용했습니다. 그러나 실제로는 데이터 손상, 계산 오류, 잘못된 청크 해석도 원인이므로 단편화가 확정되는 것은 아닙니다.”"],
  fu:["→ “CRC 계산은 직접 구현했나요?” → 정직하게. 직접 구현했다면 테이블 방식인지 비트 단위인지까지."]},

 {lv:"b",q:"GIF는 왜 중간에 끊겼나요? 어떻게 해결했습니까?",
  int:"실제로 겪은 버그인지 확인합니다. 원인을 정확히 말해야 합니다.",
  ans:["“GIF의 트레일러는 <code>3B</code> 한 바이트입니다. 이 값은 다른 데이터에도 나타날 수 있으므로 단순 검색만 하면 파일을 조기에 끊을 위험이 있습니다.”",
   "“해결책은 <b>패턴 검색을 버리고 구조를 따라가는 것</b>이었습니다. GIF는 데이터가 서브블록으로 나뉘어 있고 <b>각 블록 앞에 그 블록의 길이가 적혀</b> 있습니다. 그 길이만큼 건너뛰기를 반복하면 데이터 안의 <code>3B</code>를 밟지 않고 진짜 끝에 도달할 수 있습니다.”",
   "“이 경험으로 <b>‘푸터 검색은 보조 수단이고, 포맷 구조 추적이 본질’</b>이라는 걸 배웠습니다.”"],
  fu:["→ “PDF도 같은 문제가 있었나요?” → PDF는 증분 업데이트에서 <code>%%EOF</code>가 여러 번 나올 수 있습니다. 마지막 유효한 파일 구조·교차참조 정보를 기준으로 확인해야 하며, 단순히 마지막 문자열만 찾는 것은 충분하지 않습니다."]},

 {lv:"b",q:"리틀 엔디언이 무엇인지 예를 들어 설명해 주세요.",
  int:"ZIP 분석의 전제 지식. 예시 없이 정의만 말하면 재질문이 옵니다.",
  ans:["“숫자를 메모리나 파일에 저장할 때 <b>낮은 자리 바이트부터</b> 기록하는 방식입니다.”",
   "“<code>0x1234</code>라는 숫자는 리틀 엔디언에서 <code>34 12</code> 순서로 저장됩니다. 사람이 읽는 순서와 반대라 헷갈립니다.”",
   "“ZIP은 리틀 엔디언이므로 예를 들어 바이트 <code>34 12</code>를 <code>0x1234</code>로 해석합니다. 코드는 <code>b0 | (b1 &lt;&lt; 8)</code>처럼 조합할 수 있습니다. 실제로 오류가 났었다고 하려면 수정 기록이 있어야 합니다.”",
   "“반대로 PNG는 빅 엔디언이라 읽은 순서 그대로 쓰면 됩니다. 두 포맷을 같이 다루면서 이 차이를 분명히 알게 됐습니다.”"],
  fu:["→ “왜 리틀 엔디언을 쓰는 걸까요?” → 형식의 설계·호환성과 관련이 있으며, ZIP이 특정 CPU 때문에 선택했다고 단정하지 않는 것이 좋습니다."]},

 {lv:"b",q:"EOCD가 무엇이고, 거기서 어떤 정보를 읽었나요?",
  int:"ZIP 분석의 핵심. 약어 풀이와 역할을 모두 말해야 합니다.",
  ans:["“EOCD는 <b>End of Central Directory</b>의 약자로, 일반 ZIP 파일의 끝부분에 있는 최소 22바이트짜리 레코드입니다. 뒤에 ZIP 주석이 붙을 수 있습니다.”",
   "“여기에는 EOCD 시그니처 <code>50 4B 05 06</code>, 압축된 항목의 <b>총 개수</b>, 파일 목록(중앙 디렉터리)의 <b>크기</b>, 그리고 그 목록이 <b>시작되는 위치</b>가 들어 있습니다.”",
   "“ZIP은 목차가 맨 앞이 아니라 <b>맨 뒤</b>에 있기 때문에, 파일 끝에서부터 EOCD를 찾아 그 위치 정보를 따라가야 내부 파일 목록을 읽을 수 있습니다. 저는 그 목록의 경로를 보고 문서 종류를 판별했습니다.”"],
  fu:["→ “왜 목차가 뒤에 있을까요?” → 압축하면서 바로바로 쓸 수 있고, 여러 디스켓에 나눠 담던 시절의 설계가 남은 것입니다."]},

 {lv:"a",q:"docx, xlsx, pptx를 어떻게 구분했나요? 셋 다 시그니처가 같지 않습니까?",
  int:"관찰력과 해결 방식. 명확한 규칙을 말해야 합니다.",
  ans:["“맞습니다. 셋 다 ZIP이라 시그니처가 <code>50 4B 03 04</code>로 똑같습니다. 그래서 <b>시그니처만으로는 절대 구분할 수 없습니다.</b>”",
   "“대신 보통 ZIP 내부의 <code>word/</code>, <code>xl/</code>, <code>ppt/</code> 같은 경로와 <code>[Content_Types].xml</code> 등을 확인해 추정할 수 있습니다. 제 구현은 경로 기반의 간단한 판별 방식이었습니다.”",
   "“코드에서는 중앙 디렉터리 항목의 내부 경로가 <code>word/</code>, <code>xl/</code>, <code>ppt/</code>로 시작하는지 확인해 docx·xlsx·pptx를 <b>추정</b>하고 없으면 일반 ZIP으로 분류했습니다. 악의적으로 이름만 맞춘 ZIP을 오분류할 수 있습니다.”",
   "“다음 항목으로 넘어갈 때는 현재 항목의 길이만큼 위치를 더해 이동하는 방식으로 목록 전체를 순회했습니다.”"],
  fu:["→ “한글(.hwpx)이나 ODF도 ZIP인데 구분할 수 있나요?” → hwpx는 <code>Contents/</code>, ODF는 <code>mimetype</code> 항목으로 구분 가능합니다. 모르면 솔직히 말하고 접근 방법만 제시하세요."]},

 {lv:"b",q:"클러스터가 무엇이고, 왜 클러스터 경계에서만 검사했나요?",
  int:"성능 최적화의 근거를 이해하는지.",
  ans:["“클러스터는 파일 시스템이 저장 공간을 나누어 관리하는 <b>최소 단위</b>입니다. NTFS나 FAT32는 보통 4096바이트, 즉 4KB를 씁니다.”",
   "“일반 파일 시스템의 할당된 파일 데이터는 보통 클러스터 단위로 배치되지만, 파일 이미지 내부의 중첩 파일이나 비정렬 데이터는 예외일 수 있습니다. 그래서 기본 시그니처 탐색은 바이트 단위로 수행하고, <b>단편화 후보 위치</b>를 찾을 때 설정한 클러스터 크기와 경계를 이용했습니다.”",
   "“제 프로그램은 클러스터 크기를 <b>사용자가 입력</b>하게 했는데, 이는 분석하려는 디스크마다 값이 다를 수 있기 때문입니다.”"],
  fu:["→ “그럼 클러스터 크기를 잘못 입력하면 어떻게 되나요?” → 파일 시작점을 건너뛰어 아예 못 찾습니다. <b>정직하게 인정할 부분입니다.</b>"]},

 {lv:"b",q:"int를 unsigned char로 바꿨다고 했는데, 왜 그렇게 했고 효과가 얼마나 됐나요?",
  int:"<b>자료형 크기를 정확히 아는지</b> 확인하는 기초 CS 질문. 숫자로 답해야 합니다.",
  ans:["“처음엔 바이트 하나를 <code>int</code>에 담았는데, <code>int</code>는 <b>4바이트</b>입니다. 즉 1바이트짜리 데이터를 저장하려고 메모리를 4배 쓰고 있었습니다.”",
   "“바이트 값의 범위는 <b>0부터 255</b>까지이고, <code>unsigned char</code>가 정확히 그 범위를 <b>1바이트</b>로 표현합니다. 그래서 전부 바꿨고 <b>메모리 사용량이 1/4로 줄었습니다.</b>”",
   "“<code>signed char</code>가 아니라 <code>unsigned</code>를 쓴 이유도 중요합니다. <code>signed char</code>는 −128~127이라 <code>0xFF</code> 같은 값이 음수 −1로 읽혀서 비교문이 전부 틀어집니다. JPEG는 <code>FF</code>로 시작하니 치명적이었을 것입니다.”",
   "“이 변경과 함께 처리 가능한 최대 크기를 2MB에서 16MB로 늘렸습니다.”"],
  fu:["→ “16MB도 작지 않나요?” → 다음 질문에서 다룹니다. <b>스트리밍 처리</b>로 답하세요."],
  tip:"signed/unsigned 차이까지 말하면 C를 제대로 다뤘다는 강한 증거가 됩니다."}
 ],

 frag:[
 {lv:"a",q:"단편화가 왜 생기나요?",
  int:"현상의 원인을 이해하는지. 이게 흔들리면 복구 설명 전체가 흔들립니다.",
  ans:["“디스크에서 파일을 지우고 쓰고를 반복하면, 빈 공간이 여기저기 작게 흩어집니다.”",
   "“그 상태에서 큰 파일을 저장하면 한 군데에 통째로 넣을 자리가 없어서, <b>운영체제가 파일을 여러 조각으로 나눠 흩어진 빈 공간들에 나눠 담습니다.</b> 이게 단편화입니다.”",
   "“파일 시스템이 정상일 때는 목차에 ‘이 파일은 몇 번, 몇 번, 몇 번 클러스터에 있다’고 기록되어 있어 문제가 없습니다. <b>그런데 카빙은 그 목차가 없는 상태에서 복구하는 것이라, 단편화가 가장 큰 난관</b>이 됩니다.”"],
  fu:["→ “SSD에서도 단편화가 생기나요?” → 물리적으로는 덜 문제지만 논리적 조각화는 발생합니다."]},

 {lv:"b",q:"PNG 단편화 복구에서 png_gap_data와 png_gap_hdr은 어떻게 다른가요?",
  int:"본인 코드의 <b>함수 설계 의도</b>를 아는지. 베꼈다면 절대 설명 못 합니다.",
  ans:["“끊긴 <b>위치</b>가 다르기 때문에 두 가지로 나눴습니다.”",
   "“<code>png_gap_data</code>는 <b>청크 데이터 한가운데에서</b> 끊긴 경우입니다. 앞부분 데이터는 이미 읽었으니, 그것까지의 CRC 중간값을 계산해 두고, 다음 후보 클러스터의 남은 바이트를 이어 붙여 계산했을 때 <b>저장된 CRC와 일치하는 후보</b>를 찾습니다. 일치하면 가능한 다음 조각으로 채택합니다. CRC 일치만으로 완전한 복구를 보장하지는 못합니다.”",
   "“<code>png_gap_hdr</code>는 <b>청크와 청크의 경계에서 정확히</b> 끊긴 경우입니다. 이때는 중간값을 이어 붙일 게 없으니, 후보 클러스터들을 돌며 <b>CRC가 맞는 IDAT나 IEND 청크가 시작되는 곳</b>으로 점프합니다.”",
   "“즉 전자는 <b>조각 잇기</b>, 후자는 <b>다음 청크 찾기</b>입니다.”"],
  fu:["→ “두 경우를 어떻게 구분하나요?” → 끊긴 지점이 청크 경계와 일치하는지로 판단합니다."],
  tip:"이 질문은 <b>중요도가 높습니다.</b> 실적설명서에 함수 이름을 직접 적었기 때문입니다."},

 {lv:"c",q:"CRC가 틀리면 단편화라고 판단했다고 했는데, CRC가 틀리는 다른 원인은 없나요?",
  int:"<b>논리의 허점을 찌르는 질문.</b> 반박이 아니라 <b>인정 + 보완</b>으로 답해야 합니다.",
  ans:["“맞습니다. CRC 불일치는 단편화만의 신호가 아닙니다. <b>데이터 자체가 덮어쓰기로 손상된 경우</b>나 <b>원래 파일이 깨져 있던 경우</b>에도 똑같이 CRC가 틀립니다.”",
   "“제 프로그램은 그 둘을 구분하지 못하고 일단 단편화로 가정해 다음 조각을 찾습니다. 그래서 <b>손상된 파일에 엉뚱한 조각을 붙일 위험</b>이 있습니다.”",
   "“이 때문에 끝내 조각을 찾지 못하면 그 지점에서 잘라 <code>_partial</code>이라는 이름으로 저장하도록 했고, <b>결과 이미지는 반드시 눈으로 확인해야 한다</b>는 점을 한계로 명시했습니다.”",
   "“개선한다면 PNG 청크 연결성·디코더 재검증·여러 후보의 점수 비교를 추가하겠습니다. 엔트로피만으로 단편화와 손상을 정확히 구분할 수는 없습니다.”"],
  fu:["→ “엔트로피로 어떻게 구분하죠?” → 엔트로피는 데이터 분포를 비교하는 보조 특징일 뿐 단편화 여부를 확정하지 못합니다."],
  tip:"<b>약점을 먼저 인정하고 개선안을 붙이는</b> 이 패턴이 가장 높은 점수를 받습니다."},

 {lv:"b",q:"JPEG는 CRC가 없는데 단편화를 어떻게 판단했나요?",
  int:"포맷별로 <b>다른 전략</b>을 쓴 이유를 설명할 수 있는지.",
  ans:["“JPEG는 PNG 청크처럼 CRC32 필드가 없어 같은 방법으로 조각 일치를 확인하기 어렵습니다. 대신 JPEG 마커 규칙과 디코더의 구조적 유효성 등을 이용해 오류 가능성을 판단할 수 있습니다.”",
   "“세 가지를 봤습니다. 1. 압축 데이터 구간에 <b>나와서는 안 되는 마커</b>가 나타나는 경우, 2. <code>0x00</code>이 <b>64바이트 넘게 연속</b>되는 경우, 3. 갑자기 <b>읽을 수 있는 텍스트</b>가 나오는 경우입니다.”",
   "“이 중 하나라도 걸리면 단편화로 보고 <code>-1</code>을 반환해 조각 탐색을 시작합니다. CRC처럼 확실하지는 않은 <b>휴리스틱, 즉 경험적 판단</b>이라는 점은 분명한 한계입니다.”"],
  fu:["→ “64바이트는 어떻게 정했나요?” → 실험적으로 정한 임계값이라면 솔직히 그렇게 말하세요."]},

 {lv:"b",q:"gapMax는 무엇이고, 그 값은 어떻게 정했나요?",
  int:"상수 하나에도 <b>근거</b>가 있는지 봅니다.",
  ans:["“<code>gapMax</code>는 끊긴 지점에서 다음 조각을 <b>얼마나 멀리까지 찾아볼지</b> 정하는 탐색 범위입니다.”",
   "“범위를 너무 좁게 잡으면 멀리 떨어진 조각을 못 찾고, 너무 넓게 잡으면 <b>탐색 시간이 급격히 늘고 엉뚱한 조각을 붙일 확률도 올라갑니다.</b> 전형적인 트레이드오프입니다.”",
   "“<code>gapMax</code>의 실제 값과 선정 근거는 코드 및 테스트 기록을 확인해 설명해야 합니다. 실험으로 최적화했다는 근거가 없다면 그렇게 주장하지 않겠습니다.”",
   "“이상적으로는 <b>디스크 상태에 따라 자동으로 조정</b>되는 게 맞다고 생각합니다.”"],
  fu:["→ “실험은 어떻게 했나요?” → 조각 간격을 달리한 테스트 이미지를 만들어 비교했다면 그 과정을 말하세요."]},

 {lv:"c",q:"‘첫 번째 후보를 채택한다’고 했는데, 그게 왜 위험한가요? 더 나은 방법은 없나요?",
  int:"<b>알고리즘의 품질</b>을 스스로 평가할 수 있는지. 최고 난도 질문입니다.",
  ans:["“첫 후보 채택은 <b>탐욕적(greedy) 방식</b>입니다. 조건을 만족하는 첫 조각을 바로 붙이고 되돌아가지 않기 때문에 빠르지만, <b>우연히 조건을 통과한 엉뚱한 조각</b>을 붙여도 그대로 확정돼 버립니다.”",
   "“특히 JPEG는 CRC 검증이 없어 ‘이상이 없어 보인다’ 정도로 판단하므로 오탐 위험이 더 큽니다. 그래서 결과를 눈으로 확인해야 한다고 한계에 적었습니다.”",
   "“개선 방향은 세 가지로 생각합니다. 1. 첫 후보에서 멈추지 말고 <b>여러 후보를 모두 시도해 점수를 매긴 뒤 최선을 고르는 방식</b>, 2. 잘못 붙였을 때 되돌아가는 <b>백트래킹</b>, 3. PNG처럼 <b>검증 가능한 포맷을 먼저 처리</b>해 확실한 영역을 제외한 뒤 나머지를 탐색하는 방식입니다.”",
   "“관련 연구에 여러 조각을 탐색하는 카빙 기법들이 있으며, 제 코드는 그보다 단순한 <b>후보 탐색 휴리스틱</b>입니다. 학술 개념을 공부한 경우에만 추가로 설명하겠습니다.”"],
  fu:["→ “그 방법들의 단점은?” → 전부 <b>계산량 증가</b>입니다. 정확도와 속도의 교환."],
  tip:"학술 용어보다 실제 코드가 어떤 판단을 하고 어떤 경우 실패하는지 설명하는 것이 중요합니다."},

 {lv:"b",q:"이 프로그램의 시간 복잡도는 어떻게 되나요?",
  int:"구현만 한 게 아니라 <b>분석도 했는지</b>.",
  ans:["“제 실적설명서에는 디스크 이미지에서 한 칸씩 이동하며 시작 표식을 탐색했다고 설명되어 있습니다. 입력 크기를 <code>N</code>, 고정 길이 시그니처 수를 일정하다고 하면 기본 검색은 대략 <b>O(N)</b>입니다.”",
   "“단편화 탐색은 <code>F</code>개 끊김마다 최대 <code>G</code>개 후보를 검사하고, 각 후보의 검증 비용을 <code>L</code>이라고 하면 <b>O(N + F×G×L)</b>로 거칠게 추정할 수 있습니다. 정확한 분석은 코드의 루프 구조를 확인해야 합니다.”",
   "“즉 <b>단편화가 심할수록 급격히 느려지는</b> 구조이고, 이것이 <code>gapMax</code>를 무작정 키울 수 없는 이유입니다.”"],
  fu:["→ “실제로 얼마나 걸렸나요?” → 측정했다면 수치로, 안 했다면 “측정하지 못했다”고 솔직히."]},

 {lv:"c",q:"16MB까지만 처리된다고 했는데, 실제 수사에서는 수백 GB 디스크를 다룹니다. 어떻게 하시겠습니까?",
  int:"<b>구조적 한계</b>를 인식하고 해결 방향을 제시할 수 있는지. 실용성 검증 질문입니다.",
  ans:["“지금 방식의 근본 문제는 <b>파일 전체를 메모리에 한 번에 올려놓고</b> 작업한다는 점입니다. 그래서 메모리 크기가 곧 처리 한계가 됩니다. 500GB를 통째로 올릴 수는 없습니다.”",
   "“해결 방법은 <b>스트리밍 방식으로 바꾸는 것</b>입니다. 디스크를 일정 크기의 버퍼, 예를 들어 1MB씩 순서대로 읽어 들이면서 처리하고, 처리가 끝난 부분은 메모리에서 버리는 구조로 만들면 됩니다.”",
   "“다만 이때 <b>버퍼 경계에 시그니처가 걸쳐 있는 경우</b>를 처리해야 합니다. 앞 버퍼의 끝 몇 바이트를 다음 버퍼 앞에 겹쳐 붙이는 방식으로 해결할 수 있습니다.”",
   "“더 나아가면 운영체제의 <b>메모리 매핑(mmap)</b>을 쓰거나, 디스크 영역을 나눠 <b>병렬 처리</b>하는 방법도 있습니다. 이 부분은 고등학교에 가서 꼭 다시 구현해 보고 싶습니다.”"],
  fu:["→ “버퍼 크기는 얼마가 적당할까요?” → 디스크 I/O 단위와 맞추는 게 유리하다는 정도로."],
  tip:"‘한계를 몰랐다’가 아니라 <b>‘알고 있었고 해결 방향도 있다’</b>로 가는 것이 핵심입니다."},

 {lv:"b",q:"_partial로 저장하는 기능은 왜 만들었나요?",
  int:"설계 판단의 이유. 사소해 보여도 사고력을 드러냅니다.",
  ans:["“조각을 끝내 찾지 못했을 때 <b>아무것도 저장하지 않는 것보다, 찾은 데까지라도 남기는 게 낫다</b>고 판단했기 때문입니다.”",
   "“실제 수사에서는 이미지 일부만 복구되어도 중요한 단서가 될 수 있습니다. JPEG는 위에서부터 순차적으로 그려지므로 절반만 복구돼도 윗부분은 볼 수 있습니다.”",
   "“다만 <b>완전한 복구와 혼동되면 안 되므로</b> 파일 이름에 <code>_partial</code>을 붙여 명확히 구분했습니다. 포렌식에서는 <b>불확실한 결과를 불확실하다고 표시하는 것</b>이 중요하다고 생각했습니다.”"],
  fu:["→ “그럼 완전 복구와 부분 복구 비율은?” → 리포트에 통계를 넣었다면 그걸 언급하세요."]}
 ],

 ai:[
 {lv:"c",q:"실적설명서에 AI의 도움을 받았다고 적으셨는데, 정확히 어느 부분을 어떻게 도움받았는지 구체적으로 말해 주세요.",
  int:"<b>반드시 나오는 질문입니다.</b> 제출한 실적설명서 작성 유의사항에는 생성형 AI 활용 부분과 내용을 구체적으로 기술하라고 되어 있습니다. 질문 가능성이 있으므로 준비해야 합니다. <b>정직성이 전부입니다.</b>",
  ans:["“제출 설명서 기준으로 세 부분입니다. 첫째, <b>파일 일부를 디스크 이미지 형태로 변형하는 과정</b>입니다. 파일 일부를 일부러 조각내 가상 디스크처럼 만드는 작업에서 AI의 도움을 받았습니다. 이건 복구 알고리즘 자체가 아니라 <b>테스트 환경 준비</b>였습니다.”",
   "“둘째, <b>리포트 파일을 구성하는 과정</b>입니다. 정확히 어떤 코드 생성·수정에 AI를 사용했는지 기록으로 확인하여 말하겠습니다.”",
   "“셋째, <b>JPEG 마커 검사와 파일의 끝·유효성을 판별하는 과정</b>입니다. AI가 제안한 코드 범위와 제가 수정한 범위를 원본 코드·대화 기록과 대조해 구체적으로 설명하겠습니다.”",
   "“설명서에서는 시그니처·푸터 조사, 변수 크기 조정, EOCD를 통한 파일 분류 등 자신이 한 일을 적었습니다. 다만 <b>AI가 작성한 코드와 본인 수정 코드의 경계</b>는 기록으로 확인해 설명하겠습니다. 직접 하지 않은 일을 직접 했다고 말하지 않겠습니다.”"],
  fu:["→ “방금 말한 JPEG 마커 검사 코드, 지금 설명해 보세요.” — <b>반드시 이어집니다.</b>"],
  warn:"절대 <b>축소하거나 숨기지 마세요.</b> 요강에 명시된 항목이라 면접관은 이미 답을 보고 들어옵니다. 숨기는 순간 신뢰가 무너집니다.",
  tip:"<b>“도움받은 부분 → 직접 한 부분 → 받은 것도 이해하고 수정함”</b> 3단 구조로 말하면 오히려 가산점이 됩니다."},

 {lv:"c",q:"AI가 작성한 코드를 본인이 정말 이해하고 있습니까? 그 함수를 지금 설명해 보세요.",
  int:"<b>본인 수행 확인의 핵심 질문.</b> 앞 질문의 꼬리로 거의 항상 따라옵니다.",
  ans:["“<code>jpeg_scan</code> 함수를 설명드리겠습니다. 이 함수는 SOS 마커 이후의 압축 데이터 구간을 한 바이트씩 보면서 <b>지금 이 데이터가 정상인지</b> 판단합니다.”",
   "“<code>FF</code>를 만나면 다음 바이트를 확인합니다. <code>FF 00</code>이면 바이트 스터핑이라 정상 데이터로 넘기고, <code>FF D9</code>면 파일 끝이므로 종료합니다. 그런데 <b>이 구간에 나와서는 안 되는 마커</b>가 나오면 이상 신호로 봅니다.”",
   "“또 <code>0x00</code>이 64바이트 넘게 이어지거나 읽을 수 있는 텍스트가 나오면 역시 이상으로 판단해 <code>-1</code>을 반환합니다. 그러면 호출한 쪽에서 <code>jpeg_gap</code>을 불러 다음 조각을 찾습니다.”",
   "“64바이트 기준은 코드에 적힌 휴리스틱이며, 왜 그 수치인지 근거를 확인해 답해야 합니다. AI가 제안한 값인지도 명확히 구분하겠습니다.”"],
  fu:["→ “FF 00이 왜 필요하죠?” → 데이터 안의 FF가 마커로 오인되지 않게 하는 바이트 스터핑."],
  warn:"정확히 설명하기 어렵다면 실제로 이해한 범위를 정직하게 답하세요. 코드를 열어 입력·반환·반례를 설명할 수 있게 연습하세요."},

 {lv:"b",q:"AI 도움 없이 혼자 했다면 결과가 달랐을까요?",
  int:"자기 기여도를 <b>과장도 비하도 없이</b> 평가하는지.",
  ans:["“시간은 더 걸렸겠지만 <b>핵심 기능은 만들었을 것</b>이라고 생각합니다. 구조 설계와 CRC 기반 복구는 제가 포맷 명세를 직접 읽고 만든 부분이기 때문입니다.”",
   "“다만 리포트 출력 같은 부가 기능까지는 2개월 안에 못 끝냈을 수 있습니다.”",
   "“AI를 쓰면서 중요하게 생각한 기준은 <b>‘이해하지 못한 코드는 넣지 않는다’</b>였습니다. 이해하지 못한 코드가 들어가면 버그가 났을 때 제가 고칠 수 없기 때문입니다. 실제로 AI가 준 코드 중에 제 자료형과 맞지 않는 부분이 있어 직접 수정한 적도 있습니다.”"],
  fu:["→ “고친 사례 하나만 말해 보세요.”"]},

 {lv:"b",q:"AI를 어떻게 쓰는 것이 올바른 사용이라고 생각하나요?",
  int:"가치관과 태도. <b>해킹방어과 지원자의 윤리 의식</b>을 함께 봅니다.",
  ans:["“AI는 <b>검색을 대신하는 도구</b>이지 사고를 대신하는 도구는 아니라고 생각합니다.”",
   "“제 기준은 두 가지였습니다. 첫째, <b>무엇을 만들지는 내가 정한다</b>. AI에게 ‘데이터 카빙 프로그램 만들어 줘’라고 하는 것과, 제가 설계한 구조 안에서 ‘이 부분 출력 서식을 어떻게 짜면 좋을까’라고 묻는 것은 전혀 다릅니다.”",
   "“둘째, <b>이해하지 못한 코드는 쓰지 않는다</b>입니다. 이해 못 한 코드는 제 것이 아니고, 문제가 생겨도 고칠 수 없습니다.”",
   "“보안 분야는 특히 <b>원리를 모르고 도구만 쓰면 위험하다</b>고 생각합니다. 그래서 더 엄격하게 기준을 지키려 했습니다.”"],
  fu:["→ “그 기준을 어긴 적은 없었나요?” — 있었다면 솔직하게, 그리고 어떻게 바로잡았는지."]}
 ],

 limit:[
 {lv:"a",q:"이 프로그램의 한계는 무엇이라고 생각하나요?",
  int:"실적설명서에 직접 쓴 내용. <b>본인이 쓴 글을 기억하는지</b>부터 확인합니다.",
  ans:["“크게 세 가지입니다. 첫째, <b>심하게 손상되거나 덮어쓰인 데이터는 복구할 수 없습니다.</b> 카빙은 남아 있는 조각을 잇는 방식이지 없는 데이터를 만들어 내지는 못합니다.”",
   "“둘째, <b>조각의 원래 순서를 정확히 판단하지 못할 수 있습니다.</b> 특히 JPEG는 검증값이 없어 그럴듯해 보이는 조각을 붙여도 실제로는 틀릴 수 있습니다.”",
   "“셋째, <b>복구에 성공한 것처럼 보여도 내용이 온전하다고 확신할 수 없습니다.</b> 그래서 결과를 반드시 눈으로 확인해야 한다고 적었습니다.”",
   "“추가로 16MB 메모리 적재 방식이라는 규모 한계도 있습니다.”"],
  fu:["→ “그중 가장 심각한 건?” → 저는 <b>세 번째</b>라고 봅니다. 포렌식은 <b>증거의 신뢰성</b>이 생명이기 때문입니다."]},

 {lv:"b",q:"복구 성공률은 얼마나 됐나요? 어떻게 측정했습니까?",
  int:"<b>정량 평가를 했는지.</b> 안 했다면 솔직히 말하고, 어떻게 측정해야 하는지를 말해야 합니다.",
  ans:["“(측정했다면 수치로 답하고 조건을 함께 밝히세요. 예: 단편화 없는 경우 %, 2조각 단편화 %)”",
   "“(측정하지 못했다면) 솔직히 체계적인 성공률 측정은 하지 못했습니다. 눈으로 확인하는 방식에 머물렀습니다. 돌아보면 이게 가장 아쉬운 부분입니다.”",
   "“제대로 측정하려면 <b>원본 파일을 미리 알고 있는 테스트 이미지</b>를 만들어, 복구 결과와 원본의 <b>해시값을 비교</b>해야 합니다. 해시가 같으면 완전 복구, 다르면 부분 복구로 자동 집계할 수 있습니다.”",
   "“단편화 조각 수를 1개, 2개, 3개로 늘려 가며 성공률 변화를 측정하면 알고리즘 성능을 객관적으로 보여 줄 수 있었을 것입니다.”"],
  fu:["→ “그럼 지금이라도 측정해 보실 생각이 있나요?”"],
  tip:"측정하지 않았다면 <b>“측정 방법을 설계할 줄 안다”</b>는 것으로 만회할 수 있습니다."},

 {lv:"b",q:"테스트는 어떻게 했나요? 테스트용 디스크 이미지는 어떻게 만들었습니까?",
  int:"실험 환경을 직접 구성했는지.",
  ans:["“실제 디스크를 쓸 수는 없어서, 여러 파일을 이어 붙이고 일부러 조각내어 <b>디스크 이미지 비슷한 파일</b>을 만들어 테스트했습니다.”",
   "“(AI 도움을 받은 부분이므로 반드시 함께 밝히세요.) 이 변환 과정 일부는 AI의 도움을 받았습니다.”",
   "“정확한 테스트 항목과 결과 수치는 제출한 설명서만으로 모두 확인되지 않으므로, 테스트 파일 목록과 실행 로그를 정리해 두겠습니다.”",
   "“설명서에는 복구 전·후 이미지가 있으므로, 어떤 파일을 어떤 방법으로 확인했는지 실제 기록대로 설명하겠습니다.”"],
  fu:["→ “실제 포렌식 테스트 이미지 세트가 있다는 건 아시나요?” → DFRWS 챌린지 등 공개 데이터셋. 모르면 솔직히."]},

 {lv:"b",q:"복구한 파일이 원본과 같은지 어떻게 검증하나요?",
  int:"<b>해시 개념</b>을 아는지. 포렌식의 기본입니다.",
  ans:["“<b>해시값을 비교</b>하면 됩니다. MD5나 SHA-256으로 원본과 복구본의 해시를 각각 구해서 같으면 완전히 동일한 파일입니다.”",
   "“해시는 데이터가 <b>단 한 비트만 달라도 값이 완전히 바뀌기</b> 때문에, 파일이 온전한지 증명하는 데 쓰입니다.”",
   "“실제 포렌식에서는 복구 검증뿐 아니라, <b>증거 수집 단계에서 원본 디스크의 해시를 먼저 구해 두고</b> 분석이 끝난 뒤 값이 그대로인지 확인해 ‘증거를 변경하지 않았다’는 것을 증명합니다.”",
   "“설명서에는 해시 기반 자동 검증이 제시되지 않았으므로, 실제 코드에 없다면 다음 개선 기능으로 추가하고 싶습니다.”"],
  fu:["→ “MD5와 SHA-256 중 뭐가 더 안전한가요?” → MD5는 충돌이 발견되어 SHA-256을 권장합니다."]},

 {lv:"c",q:"이 프로그램을 실제 수사에 쓰려면 무엇이 더 필요할까요?",
  int:"<b>기술을 넘어 절차·법적 요건</b>까지 생각하는지. 해킹방어과 지원자에게 중요한 질문입니다.",
  ans:["“기술적으로는 대용량 스트리밍 처리, 복구 신뢰도 표시, 더 많은 포맷 지원이 필요합니다.”",
   "“하지만 그보다 중요한 건 <b>절차적 요건</b>이라고 생각합니다. 세 가지를 꼽겠습니다.”",
   "“첫째, <b>원본 보존</b>입니다. 쓰기 방지 장치를 써서 원본 디스크에 단 1바이트도 쓰지 않고, 복제본으로만 작업해야 합니다.”",

   "“셋째, <b>연계 보관성</b>입니다. 누가 언제 무엇을 했는지 전 과정이 기록으로 남아야 법정에서 증거로 인정됩니다.”",

  tip:"기술만 말하는 지원자가 대부분입니다. <b>절차·윤리까지 말하면 확실히 차별화</b>됩니다."},

 {lv:"b",q:"PhotoRec이나 Foremost 같은 기존 도구가 이미 있는데, 직접 만든 의미가 무엇인가요?",
  int:"<b>살짝 도발적인 질문.</b> 위축되지 말고 학습 목적을 당당히 말해야 합니다.",
  ans:["“기존 도구를 이기려고 만든 것이 아닙니다. <b>원리를 이해하기 위해</b> 만들었습니다.”",
   "“기성 도구가 제공하는 복구 결과를 넘어, 파일의 시작·끝과 단편화가 어떻게 작동하는지 직접 코드로 확인한 점이 학습 성과입니다. 기존 도구 사용 경험은 실제 경험일 경우에만 말하겠습니다.”",
   "“제 구현의 한계는 잘 알고 있습니다. 상용·오픈소스 도구의 성능과 직접 비교한 데이터는 아직 제시하지 못했습니다.”",
   "“<b>도구를 쓰는 사람에서 도구를 이해하는 사람으로</b> 한 걸음 간 것이 가장 큰 의미입니다.”"],

 {lv:"b",q:"다음에 기능을 추가한다면 무엇을 하고 싶습니까?",

 {lv:"c",q:"요즘 SSD는 TRIM 기능 때문에 삭제 데이터가 즉시 지워집니다. 그럼 카빙이 의미가 없어지는 것 아닌가요?",
  int:"<b>최신 기술 동향</b>을 아는지. 모르면 솔직히 인정하되 사고력을 보여야 합니다.",
  ans:["“중요한 지적입니다. TRIM은 운영체제가 ‘이 블록은 더 이상 안 쓴다’고 SSD에 알려 주고, SSD가 미리 실제로 지워 버리는 기능입니다. 그래서 <b>SSD에서는 삭제 직후 데이터가 사라져 카빙이 어려워집니다.</b>”",
   "“그래도 카빙이 무의미해지지는 않는다고 생각합니다. 이유는 세 가지입니다. 1. TRIM이 꺼져 있거나 지원하지 않는 환경이 여전히 있고, 2. <b>매체 및 컨트롤러에 따라</b> 동작이 다르고, 3. 삭제된 파일뿐 아니라 <b>손상된 파일 시스템에서 복구</b>할 때도 카빙이 쓰이기 때문입니다.”",
   "“다만 SSD 환경에서는 복구보다 <b>로그나 캐시 같은 다른 흔적</b>을 분석하는 쪽이 중요해진다고 알고 있습니다. 이 부분은 더 공부하고 싶습니다.”"],
  fu:["→ “그럼 SSD 포렌식은 어떻게 하죠?” → 모르면 “아직 공부하지 못했습니다”로 솔직하게."],
  warn:"모르는 내용이면 아는 척하지 말고 <b>“그 부분은 아직 공부하지 못했습니다”</b> + 아는 범위에서의 추론으로 답하세요."}

 {lv:"b",q:"3년간의 계획을 학년별로 말해 보세요.",

 {lv:"b",q:"화이트해커란 무엇이라고 생각합니까?",

 document.getElementById('simmeta').textContent='세트 종료';}}

 const el=document.getElementById('simt');if(!el){stopT();return;}el.textContent=`${m}:${s}`;el.style.color=sec>110?'#A61B50':sec>60?'#9A5B00':'#7B1440';if(simSet.length){let mm=String(Math.floor(mockElapsed/60)).padStart(2,'0'),ss=String(mockElapsed%60).padStart(2,'0');document.getElementById('simmeta').textContent=`세트 ${simIndex+1}/${simSet.length} · 전체 ${mm}:${ss} / 10:00${mockElapsed>600?' (권장 시간 초과)':''}`;}},1000);}
