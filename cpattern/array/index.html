<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C언어 배열과 반복문 문제풀이 패턴 10선</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--no:#dc2626;--code:#0f172a;--ct:#e2e8f0;--hl:#2563eb55;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#181c26;--tx:#e5e7eb;--mut:#9ca3af;--pri:#60a5fa;--bd:#2a3040;--hl:#60a5fa44}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:'Pretendard','Noto Sans KR','맑은 고딕',sans-serif;line-height:1.6}
header{padding:28px 20px 8px;max-width:980px;margin:auto}h1{margin:0;font-size:24px}header p{color:var(--mut);margin:6px 0 0}
nav{max-width:980px;margin:12px auto;padding:0 20px;display:flex;flex-wrap:wrap;gap:6px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}nav button.done::after{content:' ✓';color:var(--ok)}nav button.on.done::after{color:#fff}
main{max-width:980px;margin:auto;padding:0 20px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:20px}.tag{color:var(--mut);font-size:13px;margin-bottom:10px}
.tip{background:#f59e0b1f;border-left:4px solid #f59e0b;padding:8px 12px;border-radius:6px;margin-top:12px;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--bd);padding:7px 10px;text-align:left}th{background:var(--bg)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.code{background:var(--code);color:var(--ct);border-radius:10px;padding:10px 0;font:13px/1.7 Consolas,'D2Coding',monospace;overflow-x:auto}
.ln{padding:0 12px;white-space:pre}.ln span{display:inline-block;width:24px;color:#64748b;user-select:none}.ln.on{background:var(--hl);box-shadow:inset 3px 0 var(--pri)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.ctl input{width:84px;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.box{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;min-height:48px}.box b{font-size:12px;color:var(--mut);display:block}
pre.out{margin:0;font:14px Consolas,monospace;white-space:pre}.note{color:var(--pri);font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
.opt.ok{background:#16a34a22;border-color:var(--ok)}.opt.no{background:#dc262622;border-color:var(--no)}
</style></head><body>
<header><h1>C언어 배열과 반복문 문제풀이 패턴 10선</h1><p>문제 키워드를 보고 알맞은 패턴을 떠올리는 연습 — 코드를 한 줄씩 실행하며 변수 변화를 확인하세요.</p></header>
<nav id="nav"></nav><main id="app"></main>
<script>
function mk(fn){return function(p){const v={},st=[];const S=(l,note,out,k)=>st.push({l,v:JSON.parse(JSON.stringify(v)),note:note||'',out:out||'',k:k?1:0});fn(p,v,S);return st;};}
const fmt=a=>'['+a.join(',')+']';
const PATTERNS=[
{no:1,title:'배열 순회 합·평균',kw:'총점, 평균, 배열의 모든 원소 더하기',
 desc:'인덱스 i를 0부터 길이-1까지 돌리며 a[i]를 하나씩 꺼내 누적합니다. 배열 문제의 가장 기본이 되는 순회 틀입니다.',
 tip:'평균은 sum / n 처럼 정수끼리 나누면 소수점이 버려집니다. (double)sum / n 으로 계산하세요.',
 params:[{k:'n',label:'사용할 개수 n',d:5,min:1,max:5}],
 code:['int a[5] = {7, 3, 9, 4, 6}, n, sum = 0;','scanf("%d", &n);','for (int i = 0; i < n; i++) {','    sum += a[i];','}','printf("%d %.1f", sum, (double)sum / n);'],
 trace:mk((p,v,S)=>{const A=[7,3,9,4,6];v.n=p.n;v.sum=0;S(1,'n 입력');for(let i=0;i<p.n;i++){v.i=i;v['a[i]']=A[i];S(2,'i='+i+' < n');v.sum+=A[i];S(3,'sum에 a['+i+']='+A[i]+' 더함',0,1);}delete v.i;delete v['a[i]'];S(5,'합과 평균 출력',v.sum+' '+(v.sum/p.n).toFixed(1));}),
 quiz:{q:'sum = 29, n = 5 일 때 둘 다 int 이면 sum / n 의 값은?',o:['5.8','5','6','29'],a:1,e:'정수끼리의 나눗셈은 소수점 이하를 버려 5가 됩니다. (double)sum / n 이면 5.8.'}},
{no:2,title:'최댓값과 그 위치(인덱스)',kw:'가장 큰 값의 위치, 몇 번째, 최댓값 찾기',
 desc:'첫 원소로 max와 idx를 초기화하고, 더 큰 값을 만날 때마다 값과 위치를 함께 갱신합니다. 위치를 알면 값은 a[idx]로도 구할 수 있습니다.',
 tip:'a[i] >= max 로 쓰면 최댓값이 여러 개일 때 마지막 위치가, > 로 쓰면 처음 위치가 남습니다.',
 params:[{k:'n',label:'검사할 개수 n',d:8,min:1,max:8}],
 code:['int a[8] = {4, 9, 2, 7, 5, 8, 1, 6}, n;','scanf("%d", &n);','int max = a[0], idx = 0;','for (int i = 1; i < n; i++) {','    if (a[i] > max) {','        max = a[i];  idx = i;','    }','}','printf("%d %d", max, idx);'],
 trace:mk((p,v,S)=>{const A=[4,9,2,7,5,8,1,6];v.n=p.n;S(1,'n 입력');v.max=A[0];v.idx=0;S(2,'첫 값으로 시작');for(let i=1;i<p.n;i++){v.i=i;v['a[i]']=A[i];S(3,'i='+i+', a[i]='+A[i]);if(A[i]>v.max){S(4,'a[i] > max → 참');v.max=A[i];v.idx=i;S(5,'값과 위치를 함께 갱신',0,1);}else S(4,'a[i] ≤ max → 유지',0,1);}delete v.i;delete v['a[i]'];S(8,'출력',v.max+' '+v.idx);}),
 quiz:{q:'if (a[i] >= max) 로 바꾸면 최댓값이 여러 개일 때 idx는?',o:['처음 위치','마지막 위치','항상 0','오류'],a:1,e:'같은 값을 만날 때도 갱신되므로 마지막 최댓값의 위치가 남습니다.'}},
{no:3,title:'빈도 세기 (카운팅 배열)',kw:'각 숫자가 몇 번, 점수 분포, 값의 개수 세기',
 desc:'값 자체를 인덱스로 쓰는 패턴입니다. cnt[a[i]]++ 한 줄로 값별 등장 횟수가 쌓이고, 두 번째 반복문에서 결과를 출력합니다.',
 tip:'cnt 배열은 반드시 {0}으로 초기화하세요. 값의 최댓값보다 배열 크기가 커야 합니다.',
 params:[{k:'n',label:'사용할 개수 n',d:8,min:1,max:8}],
 code:['int a[8] = {2, 1, 4, 2, 2, 0, 1, 2}, n;','int cnt[5] = {0};','scanf("%d", &n);','for (int i = 0; i < n; i++) {','    cnt[a[i]]++;','}','for (int v = 0; v < 5; v++) {','    printf("%d:%d ", v, cnt[v]);','}'],
 trace:mk((p,v,S)=>{const A=[2,1,4,2,2,0,1,2],c=[0,0,0,0,0];const show=()=>c.forEach((x,k)=>v['cnt['+k+']']=x);show();S(1,'cnt 전체를 0으로');v.n=p.n;S(2,'n 입력');for(let i=0;i<p.n;i++){v.i=i;v['a[i]']=A[i];c[A[i]]++;show();S(4,'cnt['+A[i]+'] 증가',0,1);}delete v.i;delete v['a[i]'];for(let x=0;x<5;x++){v.v=x;S(6,'v='+x);S(7,'빈도 출력',x+':'+c[x]+' ');}}),
 quiz:{q:'int cnt[5]; 처럼 초기화 없이 선언한 지역 배열로 카운팅하면?',o:['0으로 자동 초기화','쓰레기 값에서 시작해 결과가 틀릴 수 있음','컴파일 오류','자동 정렬됨'],a:1,e:'초기화하지 않은 지역 배열에는 임의의 값이 들어 있습니다.'}},
{no:4,title:'선형 탐색 (찾으면 break)',kw:'값이 있는지, 몇 번째에 있는지, 처음 나오는 위치',
 desc:'처음부터 하나씩 비교하다가 찾으면 위치를 저장하고 break로 멈춥니다. 끝까지 못 찾았을 때를 구분하기 위해 위치 변수를 -1로 시작합니다.',
 tip:'pos의 초기값을 0으로 두면 "못 찾음"과 "0번째에 있음"을 구분할 수 없습니다.',
 params:[{k:'key',label:'찾을 값 key',d:9,min:1,max:9}],
 code:['int a[6] = {5, 8, 3, 9, 1, 7}, key, pos = -1;','scanf("%d", &key);','for (int i = 0; i < 6; i++) {','    if (a[i] == key) {','        pos = i;','        break;','    }','}','printf("%d", pos);'],
 trace:mk((p,v,S)=>{const A=[5,8,3,9,1,7];v.pos=-1;v.key=p.key;S(1,'key 입력, pos는 -1로 시작');let f=0;for(let i=0;i<6;i++){v.i=i;v['a[i]']=A[i];S(2,'i='+i+', a[i]='+A[i]);if(A[i]==p.key){S(3,'같음 → 찾음');v.pos=i;S(4,'위치 저장');S(5,'break로 탐색 종료');f=1;break;}S(3,'다름 → 계속',0,1);}if(!f)S(2,'i=6 → 끝까지 못 찾고 종료');delete v.i;delete v['a[i]'];S(8,'출력',String(v.pos));}),
 quiz:{q:'key = 4 를 입력하면 출력은?',o:['0','-1','5','오류'],a:1,e:'배열에 4가 없어 pos가 -1 그대로 출력됩니다.'}},
{no:5,title:'뒤집기 (양 끝 교환)',kw:'배열 뒤집기, 역순 출력, 대칭 확인(회문)',
 desc:'i번째와 n-1-i번째를 서로 바꾸되, 반복은 절반(n/2)까지만 합니다. 교환은 임시 변수 tmp를 거쳐야 값이 사라지지 않습니다.',
 tip:'i < n 까지 끝까지 돌리면 두 번씩 교환되어 원래 배열로 돌아옵니다.',
 params:[{k:'n',label:'길이 n',d:6,min:2,max:8}],
 code:['int a[8] = {1, 2, 3, 4, 5, 6, 7, 8}, n;','scanf("%d", &n);','for (int i = 0; i < n / 2; i++) {','    int tmp = a[i];','    a[i] = a[n - 1 - i];','    a[n - 1 - i] = tmp;','}','for (int i = 0; i < n; i++) printf("%d ", a[i]);'],
 trace:mk((p,v,S)=>{const c=[1,2,3,4,5,6,7,8].slice(0,p.n),n=p.n;v.n=n;v.a=fmt(c);S(1,'n 입력');for(let i=0;i<Math.floor(n/2);i++){v.i=i;S(2,'i='+i+' < n/2='+Math.floor(n/2));v.tmp=c[i];S(3,'tmp에 a[i] 보관');c[i]=c[n-1-i];v.a=fmt(c);S(4,'a[i]에 맞은편 값 복사');c[n-1-i]=v.tmp;v.a=fmt(c);S(5,'맞은편에 tmp 저장',0,1);}delete v.i;delete v.tmp;for(let i=0;i<n;i++)S(7,'a['+i+'] 출력',c[i]+' ');}),
 quiz:{q:'반복 조건을 i < n 으로 바꾸면 결과 배열은?',o:['뒤집힌 배열','원래 배열 그대로','절반만 뒤집힘','오류'],a:1,e:'모든 쌍이 두 번씩 교환되어 처음 상태로 돌아갑니다.'}},
{no:6,title:'한 칸씩 밀기 (회전·삽입)',kw:'오른쪽으로 한 칸 이동, 원소 삽입, 회전',
 desc:'마지막 값을 따로 보관한 뒤, 뒤에서부터 앞 값을 복사해 한 칸씩 밉니다. 마지막에 보관해 둔 값을 맨 앞에 넣으면 오른쪽 회전이 됩니다.',
 tip:'밀 때는 반드시 뒤에서부터(i--) 해야 합니다. 앞에서부터 밀면 같은 값이 계속 복사됩니다.',
 params:[{k:'n',label:'길이 n',d:5,min:2,max:6}],
 code:['int a[6] = {1, 2, 3, 4, 5, 6}, n;','scanf("%d", &n);','int last = a[n - 1];','for (int i = n - 1; i > 0; i--) {','    a[i] = a[i - 1];   // 뒤에서부터 밀기','}','a[0] = last;','for (int i = 0; i < n; i++) printf("%d ", a[i]);'],
 trace:mk((p,v,S)=>{const n=p.n,c=[1,2,3,4,5,6].slice(0,n);v.n=n;v.a=fmt(c);S(1,'n 입력');v.last=c[n-1];S(2,'마지막 값 '+v.last+' 보관');for(let i=n-1;i>0;i--){v.i=i;S(3,'i='+i);c[i]=c[i-1];v.a=fmt(c);S(4,'a['+i+']에 a['+(i-1)+'] 복사',0,1);}delete v.i;c[0]=v.last;v.a=fmt(c);S(6,'맨 앞에 last 저장');for(let i=0;i<n;i++)S(7,'a['+i+'] 출력',c[i]+' ');}),
 quiz:{q:'앞에서부터(i = 1 → n-1) a[i] = a[i-1] 로 밀면 {1, 2, 3}은?',o:['3 1 2','1 1 1','2 3 1','1 2 3'],a:1,e:'a[1]=a[0]=1, a[2]=a[1]=1 이 되어 1 1 1 이 됩니다.'}},
{no:7,title:'버블 정렬 (인접 비교 · 교환)',kw:'오름차순 정렬, 인접한 두 값 비교, 순서 바꾸기',
 desc:'인접한 두 원소를 비교해 순서가 틀리면 교환합니다. 한 번 훑을 때마다 가장 큰 값이 맨 뒤에 자리를 잡으므로 훑는 범위가 1씩 줄어듭니다.',
 tip:'안쪽 반복의 끝은 n-1-i 입니다. a[j+1]이 배열 범위를 넘지 않게 주의하세요.',
 params:[],inp:'없음 (배열 5 3 8 1 4 가 코드에 고정)',
 code:['int a[5] = {5, 3, 8, 1, 4};','for (int i = 0; i < 4; i++) {','    for (int j = 0; j < 4 - i; j++) {','        if (a[j] > a[j + 1]) {','            int tmp = a[j]; a[j] = a[j + 1]; a[j + 1] = tmp;','        }','    }','}','for (int i = 0; i < 5; i++) printf("%d ", a[i]);'],
 trace:mk((p,v,S)=>{const c=[5,3,8,1,4];v.a=fmt(c);S(0,'초기 배열');for(let i=0;i<4;i++){v.i=i;S(1,(i+1)+'번째 훑기 시작');for(let j=0;j<4-i;j++){v.j=j;S(2,'j='+j+': a[j]='+c[j]+', a[j+1]='+c[j+1]);if(c[j]>c[j+1]){S(3,'앞이 더 큼 → 교환');const t=c[j];c[j]=c[j+1];c[j+1]=t;v.a=fmt(c);S(4,'교환 완료');}else S(3,'순서가 맞음 → 그대로');}delete v.j;S(6,(i+1)+'번째 훑기 끝: 맨 뒤 값 확정',0,1);}delete v.i;for(let i=0;i<5;i++)S(8,'a['+i+'] 출력',c[i]+' ');}),
 quiz:{q:'첫 번째 훑기(i = 0)가 끝난 직후 배열의 맨 끝 값은?',o:['1','4','5','8'],a:3,e:'한 번 훑으면 가장 큰 값 8이 맨 뒤로 이동합니다. ([3,5,1,4,8])'}},
{no:8,title:'누적합 배열 (구간합)',kw:'l번부터 r번까지의 합, 구간합, 여러 번 질의',
 desc:'p[i+1] = p[i] + a[i] 로 앞에서부터의 합을 미리 만들어 두면, 구간 [l, r]의 합을 p[r] - p[l-1] 한 번의 뺄셈으로 구합니다.',
 tip:'p[0] = 0 을 두는 것이 핵심입니다. 인덱스가 1부터인지 0부터인지 주의하세요.',
 params:[{k:'l',label:'l (1~6)',d:2,min:1,max:6},{k:'r',label:'r (1~6)',d:5,min:1,max:6}],
 code:['int a[6] = {3, 1, 4, 1, 5, 9}, p[7] = {0}, l, r;','scanf("%d %d", &l, &r);','for (int i = 0; i < 6; i++) {','    p[i + 1] = p[i] + a[i];','}','printf("%d", p[r] - p[l - 1]);'],
 trace:mk((p,v,S)=>{const A=[3,1,4,1,5,9],L=Math.min(p.l,p.r),R=Math.max(p.l,p.r),q=[0];v.l=L;v.r=R;S(1,'l, r 입력 (l ≤ r로 정리)');v.p=fmt(q);for(let i=0;i<6;i++){v.i=i;q.push(q[i]+A[i]);v.p=fmt(q);S(3,'p['+(i+1)+'] = p['+i+'] + a['+i+'] = '+q[i+1],0,1);}delete v.i;S(5,'p[r] - p[l-1] = '+q[R]+' - '+q[L-1],String(q[R]-q[L-1]));}),
 quiz:{q:'l = 1, r = 3 이면 출력은?',o:['4','8','9','13'],a:1,e:'p[3] - p[0] = 8 - 0 = 8 (3+1+4) 입니다.'}},
{no:9,title:'중복 제거 (표시 배열)',kw:'처음 나온 값만 출력, 서로 다른 값의 개수, 이미 나왔는지',
 desc:'값을 인덱스로 하는 seen 배열에 "이미 나왔다"를 표시합니다. 처음 보는 값이면 출력하고 표시, 이미 표시된 값이면 건너뜁니다.',
 tip:'seen의 크기는 값의 최댓값보다 커야 합니다. 값이 10 이상이면 seen[10]은 범위를 벗어납니다.',
 params:[{k:'n',label:'사용할 개수 n',d:6,min:1,max:6}],
 code:['int a[6] = {3, 7, 3, 9, 7, 1}, n;','int seen[10] = {0};','scanf("%d", &n);','for (int i = 0; i < n; i++) {','    if (seen[a[i]] == 0) {','        printf("%d ", a[i]);','        seen[a[i]] = 1;','    }','}'],
 trace:mk((p,v,S)=>{const A=[3,7,3,9,7,1],sn=new Set(),f=()=>'{'+[...sn].sort((a,b)=>a-b).join(',')+'}';v.seen=f();S(1,'seen을 모두 0으로 (표시 없음)');v.n=p.n;S(2,'n 입력');for(let i=0;i<p.n;i++){v.i=i;v['a[i]']=A[i];S(3,'i='+i+', a[i]='+A[i]);if(!sn.has(A[i])){S(4,'seen['+A[i]+'] == 0 → 처음 나온 값');S(5,'출력',A[i]+' ');sn.add(A[i]);v.seen=f();S(6,'seen['+A[i]+'] = 1 로 표시',0,1);}else S(4,'seen['+A[i]+'] == 1 → 이미 나온 값, 건너뜀',0,1);}}),
 quiz:{q:'a 안에 값 10이 있는데 seen[10]으로 선언했다면 seen[a[i]]에서 생기는 문제는?',o:['정상 동작','배열 범위를 벗어나 오류 또는 쓰레기 값','자동으로 크기 확장','컴파일 오류'],a:1,e:'seen[10]의 유효 인덱스는 0~9 뿐이라 seen[10]은 범위 초과(정의되지 않은 동작)입니다.'}},
{no:10,title:'두 배열 병합 (두 인덱스 이동)',kw:'정렬된 두 배열 합치기, 두 목록 비교, 한쪽이 남을 때',
 desc:'a, b 각각에 인덱스(i, j)를 두고 더 작은 쪽을 결과 배열 c에 넣으며 그쪽 인덱스만 전진합니다. 한쪽이 끝나면 남은 쪽을 그대로 복사합니다.',
 tip:'while (i < 3 && j < 3) 가 끝난 뒤 남은 원소를 복사하는 두 while을 빼먹기 쉽습니다.',
 params:[],inp:'없음 (a = 1 4 7, b = 2 3 9 가 코드에 고정)',
 code:['int a[3] = {1, 4, 7}, b[3] = {2, 3, 9}, c[6];','int i = 0, j = 0, k = 0;','while (i < 3 && j < 3) {','    if (a[i] <= b[j]) c[k++] = a[i++];','    else c[k++] = b[j++];','}','while (i < 3) c[k++] = a[i++];','while (j < 3) c[k++] = b[j++];','for (int t = 0; t < 6; t++) printf("%d ", c[t]);'],
 trace:mk((p,v,S)=>{const A=[1,4,7],B=[2,3,9],c=[];let i=0,j=0;v.i=0;v.j=0;v.k=0;v.c=fmt(c);S(1,'i, j, k 모두 0');while(i<3&&j<3){S(2,'i<3 && j<3 → 참');if(A[i]<=B[j]){c.push(A[i]);S(3,'a['+i+']='+A[i]+' ≤ b['+j+']='+B[j]+' → a에서 가져옴');i++;}else{c.push(B[j]);S(4,'a['+i+']='+A[i]+' > b['+j+']='+B[j]+' → b에서 가져옴');j++;}v.i=i;v.j=j;v.k=c.length;v.c=fmt(c);S(3,'인덱스 전진, c에 반영',0,1);}S(2,'한쪽이 끝남 → 반복 종료');while(i<3){c.push(A[i]);i++;v.i=i;v.k=c.length;v.c=fmt(c);S(6,'a의 남은 값 복사');}while(j<3){c.push(B[j]);j++;v.j=j;v.k=c.length;v.c=fmt(c);S(7,'b의 남은 값 복사');}for(let t=0;t<6;t++)S(8,'c['+t+'] 출력',c[t]+' ');}),
 quiz:{q:'병합이 끝났을 때 마지막 while에서 처리(복사)되는 값은?',o:['1','4','7','9'],a:3,e:'a가 먼저 모두 소진되고 b에 남은 9가 마지막 while에서 복사됩니다.'}}
];
PATTERNS.guide='① 배열의 길이와 인덱스 범위(0 ~ n-1) 정하기 → ② 순회 방향·시작·끝 정하기 → ③ 반복 안에서 a[i]로 할 일(누적·비교·교환) 정하기 → ④ 초기값(0, a[0], -1)과 결과 출력 위치 정하기.';

const nav=document.getElementById('nav'),app=document.getElementById('app');
let cur=-1,steps=[],si=0,timer=null,done={};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function drawNav(){nav.innerHTML='';[['개요',-1],...PATTERNS.map((p,i)=>[p.no,i])].forEach(([t,i])=>{const b=document.createElement('button');b.textContent=t;b.className=(cur===i?'on ':'')+(done[i]?'done':'');b.onclick=()=>show(i);nav.appendChild(b);});}
function show(i){clearInterval(timer);cur=i;drawNav();i<0?overview():pattern(PATTERNS[i]);window.scrollTo(0,0);}
function overview(){app.innerHTML='<div class="card"><h2>문제 키워드 → 패턴 찾기</h2><div class="tag">문제를 읽고 아래 표에서 비슷한 표현을 찾아 해당 패턴 탭을 열어 보세요.</div><table><tr><th>패턴</th><th>이런 표현이 나오면</th></tr>'+PATTERNS.map((p,i)=>`<tr><td><a href="#" onclick="show(${i});return false">${p.no}. ${p.title}</a></td><td>${p.kw}</td></tr>`).join('')+'</table><div class="tip">공통 순서: '+(PATTERNS.guide||'① 필요한 변수와 초기값 정하기 → ② 반복 범위 정하기 → ③ 반복 안의 조건 세우기 → ④ 반복 밖에서 결과 출력.')+'</div></div>';}
function pattern(P){
 app.innerHTML=`<div class="card"><h2>패턴 ${P.no}. ${P.title}</h2><div class="tag">키워드: ${P.kw}</div><p>${P.desc}</p>
 <div class="ctl">${P.params.map(q=>`<label>${q.label} <input type="number" id="in_${q.k}" value="${q.d}" min="${q.min}" max="${q.max}"></label>`).join('')}${P.inp?`<span>입력: <b>${P.inp}</b></span>`:''}
 <button class="btn p" onclick="run()">▶ 실행</button><button class="btn" onclick="mv(-1)">◀ 이전</button><button class="btn" onclick="mv(1)">다음 ▶</button><button class="btn" onclick="auto()">⏯ 자동</button></div>
 <div class="grid"><div class="code" id="code">${P.code.map((c,k)=>`<div class="ln" id="l${k}"><span>${k+1}</span>${esc(c)}</div>`).join('')}</div>
 <div><div class="box"><b>변수 상태</b><div id="vars">—</div></div><div class="box"><b>출력</b><pre class="out" id="out"></pre></div><div class="box"><b>설명</b><div class="note" id="note">▶ 실행을 눌러 시작하세요.</div></div></div></div>
 <div class="tip">⚠ 실수 포인트: ${P.tip}</div></div>
 <div class="card"><h2>확인 문제</h2><p>${P.quiz.q}</p>${P.quiz.o.map((o,k)=>`<button class="opt" onclick="ans(this,${k})">${'①②③④'[k]} ${o}</button>`).join('')}<div id="exp" class="note"></div></div>`;
 steps=[];si=0;run();
}
function run(){clearInterval(timer);const P=PATTERNS[cur],a={};P.params.forEach(q=>{let v=parseInt(document.getElementById('in_'+q.k).value);if(isNaN(v))v=q.d;a[q.k]=Math.max(q.min,Math.min(q.max,v));document.getElementById('in_'+q.k).value=a[q.k];});steps=P.trace(a);si=0;draw();}
function mv(d){si=Math.max(0,Math.min(steps.length-1,si+d));draw();}
function auto(){clearInterval(timer);if(si>=steps.length-1)si=0;timer=setInterval(()=>{if(si>=steps.length-1)return clearInterval(timer);si++;draw();},700);}
function draw(){const s=steps[si];document.querySelectorAll('.ln').forEach(e=>e.classList.remove('on'));document.getElementById('l'+s.l).classList.add('on');
 document.getElementById('vars').innerHTML='<table><tr>'+Object.keys(s.v).map(k=>`<th>${k}</th>`).join('')+'</tr><tr>'+Object.values(s.v).map(x=>`<td>${x}</td>`).join('')+'</tr></table>';
 document.getElementById('out').textContent=steps.slice(0,si+1).map(t=>t.out).join('');document.getElementById('note').textContent=`(${si+1}/${steps.length}) `+s.note;}
function ans(b,k){const Q=PATTERNS[cur].quiz,ok=k===Q.a;b.classList.add(ok?'ok':'no');if(!ok)document.querySelectorAll('.opt')[Q.a].classList.add('ok');document.getElementById('exp').textContent=(ok?'정답! ':'오답. ')+Q.e;if(ok){done[cur]=1;drawNav();}}
show(-1);
</script></body></html>
